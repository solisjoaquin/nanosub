<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoSub | Real-Time Subtitles</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="nanosub-container">
    <!-- 1. Componente Superior: Subtítulos en Inglés (Voz en tiempo real) -->
    <section class="subtitle-box source-box" id="source-box" aria-label="Subtítulos en inglés">
      <div class="box-toolbar">
        <span class="lang-badge">🇺🇸 English (Live Audio)</span>
        <button id="mic-toggle-btn" class="mic-pill" title="Iniciar o detener micrófono">
          <span class="mic-dot"></span>
          <span id="mic-status-label">Iniciar Micrófono</span>
        </button>
      </div>
      <div class="subtitle-content">
        <span id="final-source-text" class="text-final"></span>
        <span id="interim-source-text" class="text-interim">Haz clic en "Iniciar Micrófono" y habla en inglés...</span>
      </div>
    </section>

    <!-- 2. Componente Inferior: Subtítulos Traducidos (Gemini Nano) -->
    <section class="subtitle-box target-box" id="target-box" aria-label="Subtítulos traducidos">
      <div class="box-toolbar">
        <div class="target-selector">
          <span id="target-flag">🇪🇸</span>
          <select id="target-language-select" class="minimal-select" aria-label="Idioma traducido">
            <option value="es" selected>Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <span id="model-status-text" class="engine-tag" title="Estado de Gemini Nano">Gemini Nano</span>
      </div>
      <div class="subtitle-content">
        <p id="translated-text" class="text-translated placeholder">La traducción en tiempo real aparecerá aquí...</p>
      </div>
    </section>
  </main>

  <script src="js/nano-engine.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
